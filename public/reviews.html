<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>漫画のおすすめレビュー</title>
  <!-- 既存のスタイルを読み込む（下の <style> は、このページ専用の追加分） -->
  <link rel="stylesheet" href="style.css">
  <style>
    .rv-wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    .rv-card { border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 8px; padding: 16px; margin: 16px 0; }
    .rv-field { margin-bottom: 12px; }
    .rv-field label { display: block; font-weight: bold; margin-bottom: 4px; }
    .rv-field input, .rv-field select, .rv-field textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    .rv-field textarea { min-height: 80px; resize: vertical; }
    .rv-button { padding: 8px 20px; font: inherit; cursor: pointer; }
    .rv-button:disabled { opacity: 0.6; cursor: not-allowed; }
    .rv-message { min-height: 1.5em; }
    .rv-error { color: #c62828; }
    .rv-ok { color: #2e7d32; }
    #review-list { list-style: none; padding: 0; margin: 0; }
    .rv-item-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .rv-title { font-weight: bold; font-size: 1.1em; }
    .rv-stars { color: #f9a825; letter-spacing: 2px; }
    .rv-comment { white-space: pre-wrap; margin: 8px 0 4px; }
    .rv-date { font-size: 0.85em; opacity: 0.7; }
  </style>
</head>
<body>
  <main class="rv-wrap">
    <p><a href="index.html">← トップへ戻る</a></p>
    <h1>漫画のおすすめレビュー</h1>

    <section class="rv-card">
      <h2>レビューを投稿する</h2>
      <form id="review-form">
        <div class="rv-field">
          <label for="title">漫画のタイトル（100文字まで）</label>
          <input id="title" name="title" type="text" maxlength="100" required>
        </div>
        <div class="rv-field">
          <label for="rating">おすすめ度</label>
          <select id="rating" name="rating">
            <option value="5">★★★★★（5）</option>
            <option value="4">★★★★☆（4）</option>
            <option value="3">★★★☆☆（3）</option>
            <option value="2">★★☆☆☆（2）</option>
            <option value="1">★☆☆☆☆（1）</option>
          </select>
        </div>
        <div class="rv-field">
          <label for="comment">コメント（500文字まで）</label>
          <textarea id="comment" name="comment" maxlength="500"></textarea>
        </div>
        <button id="submit-button" class="rv-button" type="submit">投稿する</button>
        <p id="form-message" class="rv-message" aria-live="polite"></p>
      </form>
    </section>

    <section>
      <h2>みんなのレビュー</h2>
      <p id="list-status">読み込み中…</p>
      <ul id="review-list"></ul>
    </section>
  </main>

  <script src="reviews.js"></script>
</body>
</html>
