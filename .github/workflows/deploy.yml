name: Deploy to AWS

# main ブランチに変更が入ったときに動く。Actions タブから手動で動かすこともできる
on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# AWS に「GitHub からのログイン証明」を渡すために必要な権限
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # リポジトリのファイルを取得する
      - name: Checkout
        uses: actions/checkout@v4

      # ここから確認用（原因が分かったら消す）
      - name: Show OIDC subject
        run: |
          curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value | split(".")[1] | @base64d | fromjson | .sub'
      # ここまで

      # OIDC で AWS の役割（GitHubDeployRole）を使えるようにする
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # public フォルダの中身を S3 に反映する（public から消したファイルは S3 からも消える）
      - name: Upload to S3
        run: aws s3 sync public/ s3://${{ secrets.S3_BUCKET_NAME }}/ --delete

      # CloudFront のキャッシュを更新して、すぐ新しい内容を見られるようにする
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"