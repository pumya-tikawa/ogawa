AWSTemplateFormatVersion: '2010-09-09'
Description: ogawa-pcsite 静的サイト公開用の環境（S3 + CloudFront + GitHub Actions 用の権限）

Parameters:
  GitHubOwner:
    Type: String
    Default: pumya-tikawa
    Description: GitHub のユーザー名
  GitHubRepo:
    Type: String
    Default: ogawa
    Description: GitHub のリポジトリ名
  GitHubBranch:
    Type: String
    Default: main
    Description: このブランチに変更が入ったときだけ公開を許可する
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: このAWSアカウントに GitHub 用のIDプロバイダがまだ無ければ true、すでにあれば false

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  # サイトのファイルを置く S3 バケット（直接は公開しない）
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # CloudFront だけが S3 のファイルを読めるようにするための設定
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 世界中（日本を含む）に配信する CloudFront
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ogawa-pcsite
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS が用意している「CachingOptimized」のキャッシュ設定
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  # 上の CloudFront からの読み取りだけを許可する
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  # --- ここから GitHub Actions 用の追加分 ---

  # 「GitHub からのログインを信用する」という登録（アカウントに1つだけ作れる）
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # GitHub Actions が使う役割（このリポジトリの main ブランチからだけ使える）
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # S3 のファイルを置き換える
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              # CloudFront のキャッシュを更新する
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

Outputs:
  SiteUrl:
    Description: 公開されたサイトのURL
    Value: !Sub 'https://${SiteDistribution.DomainName}'
  BucketName:
    Description: ファイルを置く S3 バケット名（deploy.yml で使う）
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront の ID（deploy.yml で使う）
    Value: !Ref SiteDistribution
  DeployRoleArn:
    Description: GitHub Actions が使う役割の ARN（deploy.yml で使う）
    Value: !GetAtt GitHubDeployRole.Arn
