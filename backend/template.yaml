AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 記事コメント用のAPI（GET/POST /articles/{articleId}/comments）

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref CommentsTable

Resources:
  # コメントを保存するテーブル（記事ごとに、新しい順で取れる）
  CommentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: articleId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: articleId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE

  # API Gateway（HTTP API）
  CommentsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'          # 最初は全許可。あとでCloudFrontのURLに絞る
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  # 記事ごとのコメント一覧を返す
  GetCommentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: get_comments.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CommentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsApi
            Path: /articles/{articleId}/comments
            Method: GET

  # コメントを1件保存する
  PostCommentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: post_comments.lambda_handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref CommentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsApi
            Path: /articles/{articleId}/comments
            Method: POST

Outputs:
  ApiUrl:
    Description: APIのベースURL（comments.js の fetch で使う）
    Value: !Sub 'https://${CommentsApi}.execute-api.${AWS::Region}.amazonaws.com'